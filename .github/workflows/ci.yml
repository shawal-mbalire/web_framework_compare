name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Python/Flask stack: lint, types, tests against a real Postgres
  flask:
    name: Flask - lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: social_audit
          POSTGRES_USER: social_user
          POSTGRES_PASSWORD: social_pass_2026
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://social_user:social_pass_2026@localhost:5432/social_audit

    defaults:
      run:
        working-directory: ./flask-stack

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Load schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../schema.sql

      - name: Ruff
        run: |
          uv run --no-sync ruff check app tests
          uv run --no-sync ruff format --check app tests

      - name: Mypy (strict)
        run: uv run --no-sync mypy app

      - name: Pytest
        run: uv run --no-sync pytest --cov=app

  # TypeScript stacks: type-check and production build
  typescript:
    name: ${{ matrix.stack }} - type-check & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [astro-stack, tanstack-stack, angular-stack]

    defaults:
      run:
        working-directory: ./${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Build
        run: bun run build

  # Full stack: build every image and smoke-test it through Traefik
  docker-compose:
    name: Docker Compose - smoke test
    runs-on: ubuntu-latest
    needs: [flask, typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test each stack
        run: |
          for host in flask astro tanstack angular; do
            echo "== $host"
            curl -fsS -H "Host: $host.localhost" http://localhost/health
            curl -fsS -o /dev/null -H "Host: $host.localhost" http://localhost/
          done
          curl -fsS -H "Host: astro.localhost" http://localhost/api/feed | grep -q '"posts"'
          curl -fsS -H "Host: angular.localhost" http://localhost/api/feed | grep -q '"posts"'

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
