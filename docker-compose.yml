services:
  # ========================================
  # Traefik - Reverse Proxy & Load Balancer
  # ========================================
  traefik:
    image: traefik:v3.6
    container_name: social-audit-traefik
    command:
      # Enable Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      
      # Entry points
      - "--entrypoints.web.address=:80"
      
      # Enable dashboard (accessible at http://localhost:8080)
      - "--api.dashboard=true"
      - "--api.insecure=true"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"       # HTTP
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - social-audit-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  # ========================================
  # PostgreSQL Database (Shared by all stacks)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: social-audit-db
    environment:
      POSTGRES_DB: social_audit
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - social-audit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Flask Stack (Flask 3 + SQLAlchemy 2, gunicorn)
  # ========================================
  flask:
    build:
      context: ./flask-stack
      dockerfile: Dockerfile
    container_name: social-audit-flask
    environment:
      DATABASE_URL: postgresql://social_user:social_pass_2026@postgres:5432/social_audit
      SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-audit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask.rule=Host(`flask.localhost`)"
      - "traefik.http.routers.flask.entrypoints=web"
      - "traefik.http.services.flask.loadbalancer.server.port=5000"
      # Security headers
      - "traefik.http.middlewares.flask-headers.headers.customresponseheaders.X-Robots-Tag=noindex,nofollow"
      - "traefik.http.middlewares.flask-headers.headers.contentSecurityPolicy=default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:"
      - "traefik.http.middlewares.flask-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.flask-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.flask.middlewares=flask-headers"

  # ========================================
  # Astro Stack (Astro 7 + Svelte 5)
  # ========================================
  astro:
    build:
      context: ./astro-stack
      dockerfile: Dockerfile
    container_name: social-audit-astro
    environment:
      DATABASE_URL: postgresql://social_user:social_pass_2026@postgres:5432/social_audit
      JWT_SECRET: dev-jwt-secret-change-in-production
      COOKIE_SECURE: "false" # served over plain HTTP locally
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-audit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astro.rule=Host(`astro.localhost`)"
      - "traefik.http.routers.astro.entrypoints=web"
      - "traefik.http.services.astro.loadbalancer.server.port=4321"
      # Security headers
      - "traefik.http.middlewares.astro-headers.headers.contentSecurityPolicy=default-src 'self' 'unsafe-inline'"
      - "traefik.http.middlewares.astro-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.astro-headers.headers.frameDeny=true"
      - "traefik.http.routers.astro.middlewares=astro-headers"

  # ========================================
  # TanStack Start (React 19 + Bun)
  # ========================================
  tanstack:
    build:
      context: ./tanstack-stack
      dockerfile: Dockerfile
    container_name: social-audit-tanstack
    environment:
      DATABASE_URL: postgresql://social_user:social_pass_2026@postgres:5432/social_audit
      SESSION_SECRET: dev-session-secret-change-in-production-32+chars
      COOKIE_SECURE: "false" # served over plain HTTP locally
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-audit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tanstack.rule=Host(`tanstack.localhost`)"
      - "traefik.http.routers.tanstack.entrypoints=web"
      - "traefik.http.services.tanstack.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.tanstack-headers.headers.contentSecurityPolicy=default-src 'self' 'unsafe-inline'"
      - "traefik.http.middlewares.tanstack-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tanstack-headers.headers.frameDeny=true"
      - "traefik.http.routers.tanstack.middlewares=tanstack-headers"

  # ========================================
  # Angular Stack (Angular 22 SPA + Bun/Express API)
  # ========================================
  angular:
    build:
      context: ./angular-stack
      dockerfile: Dockerfile
    container_name: social-audit-angular
    environment:
      DATABASE_URL: postgresql://social_user:social_pass_2026@postgres:5432/social_audit
      JWT_SECRET: dev-jwt-secret-change-in-production
      COOKIE_SECURE: "false" # served over plain HTTP locally
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-audit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.angular.rule=Host(`angular.localhost`)"
      - "traefik.http.routers.angular.entrypoints=web"
      - "traefik.http.services.angular.loadbalancer.server.port=4200"
      # Security headers
      - "traefik.http.middlewares.angular-headers.headers.contentSecurityPolicy=default-src 'self' 'unsafe-inline'"
      - "traefik.http.middlewares.angular-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.angular-headers.headers.frameDeny=true"
      - "traefik.http.routers.angular.middlewares=angular-headers"

networks:
  social-audit-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
