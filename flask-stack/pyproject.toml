[project]
name = "social-audit-flask"
version = "0.1.0"
description = "Twitter/X clone using Flask 3.1+, SQLAlchemy 2.0, Pydantic v2 and server-rendered HTML/CSS"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "sqlalchemy>=2.1.0",
    "psycopg[binary]>=3.1.18",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "bcrypt>=4.1.2",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
