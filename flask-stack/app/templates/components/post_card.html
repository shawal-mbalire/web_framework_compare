<!-- Post Card Component -->
<article class="post-card" id="post-{{ post.id }}">
    {% if post.reposted_by %}
    <p class="post-repost">↻ <a href="{{ url_for('users.profile', username=post.reposted_by) }}">@{{ post.reposted_by }}</a> reposted</p>
    {% endif %}
    <div class="post-avatar">
        <img src="{{ post.author.avatar }}" alt="{{ post.author.display_name }}" width="48" height="48">
    </div>
    
    <div class="post-content">
        <header class="post-header">
            <div class="post-author">
                <a href="{{ url_for('users.profile', username=post.author.username) }}" class="author-name">{{ post.author.display_name }}</a>
                <span class="author-username">@{{ post.author.username }}</span>
                <a href="{{ url_for('posts.view_post', post_id=post.id) }}" class="post-time"><time datetime="{{ post.created_at_iso }}">· {{ post.created_at }}</time></a>
            </div>
            
            {% if post.author.username == session.get('username') %}
            <details class="post-menu">
                <summary aria-label="Post options">⋯</summary>
                <div class="post-menu-content">
                    <form method="POST" action="{{ url_for('posts.delete_post', post_id=post.id) }}">
                        <button type="submit" class="menu-item menu-item-danger">Delete</button>
                    </form>
                </div>
            </details>
            {% endif %}
        </header>
        
        <div class="post-body">
            <p>{{ post.content }}</p>
        </div>
        
        <footer class="post-actions">
            <!-- Reply Button - Opens Dialog -->
            <button type="button" class="action-btn" onclick="document.getElementById('reply-dialog-{{ post.id }}').showModal()" aria-label="Reply">
                <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span class="action-count">{{ post.replies_count }}</span>
            </button>
            
            <!-- Retweet Form -->
            <form method="POST" action="{{ url_for('posts.retweet_post' if not post.is_retweeted else 'posts.unretweet_post', post_id=post.id) }}" class="post-action">
                <button type="submit" class="action-btn {% if post.is_retweeted %}action-retweeted{% endif %}" aria-label="Retweet">
                    <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span class="action-count">{{ post.retweets_count }}</span>
                </button>
            </form>
            
            <!-- Like Form -->
            <form method="POST" action="{{ url_for('posts.like_post' if not post.is_liked else 'posts.unlike_post', post_id=post.id) }}" class="post-action">
                <button type="submit" class="action-btn {% if post.is_liked %}action-liked{% endif %}" aria-label="Like">
                    <svg class="action-icon" viewBox="0 0 24 24" fill="{% if post.is_liked %}currentColor{% else %}none{% endif %}" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                    <span class="action-count">{{ post.likes_count }}</span>
                </button>
            </form>
            
            <!-- Share (uses Web Share API - single JS statement) -->
            <button type="button" class="action-btn" aria-label="Share" onclick="const url = window.location.origin + '/posts/{{ post.id }}'; navigator.share ? navigator.share({url}).catch(() => {}) : navigator.clipboard.writeText(url)">
                <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                </svg>
            </button>
        </footer>
    </div>
    
    <!-- Include Reply Dialog for this post -->
    {% include 'components/reply_dialog.html' %}
</article>
