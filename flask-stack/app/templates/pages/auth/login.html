{% extends "base.html" %}

{% block title %}Login - Social Audit{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <header class="auth-header">
            <h2>Login to Social Audit</h2>
            <p class="text-muted">Welcome back! Please enter your credentials.</p>
        </header>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    autofocus
                    autocomplete="username"
                    placeholder="johndoe"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    autocomplete="current-password"
                    minlength="8"
                >
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="1">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <footer class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
            <p><a href="/auth/forgot-password">Forgot password?</a></p>
        </footer>
    </div>
</div>
{% endblock %}
